name: Release portable zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.10'
        required: true

permissions:
  contents: write

jobs:
  release-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build pinned codecs and OpenEXR bridge (x64)
        uses: ./.github/actions/build-codecs

      - name: Build portable zip
        id: portable
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
              $version = '${{ github.ref_name }}'
              if ($version.StartsWith('v')) {
                  $version = $version.Substring(1)
              }
          }

          .\eng\publish-portable.ps1 -Version $version -Platform x64 -SkipNative

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_URL: ${{ vars.STORE_URL }}
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
              $tag = '${{ github.ref_name }}'
              $version = $tag.TrimStart('v')
          }
          else {
              $tag = "v$version"
          }

          $zip = '${{ steps.portable.outputs.zip_path }}'
          if (-not (Test-Path $zip)) {
              throw "Portable zip not found: $zip"
          }

          $changelogPath = Join-Path $PWD 'CHANGELOG.md'
          if (-not (Test-Path $changelogPath)) {
              throw "CHANGELOG.md not found."
          }

          $changelogLines = Get-Content -Path $changelogPath
          $candidateVersions = @($version)
          if ($version -match '^\d+\.\d+\.\d+$') {
              $candidateVersions = @("$version.0") + $candidateVersions
          }

          $sectionStart = $null
          foreach ($candidateVersion in $candidateVersions) {
              $pattern = '^##\s+' + [regex]::Escape($candidateVersion) + '(\s|$|-)'
              $match = $changelogLines | Select-String -Pattern $pattern | Select-Object -First 1
              if ($match) {
                  $sectionStart = $match.LineNumber
                  break
              }
          }

          if (-not $sectionStart) {
              throw "CHANGELOG.md does not contain a section for $version."
          }

          $nextSection = $changelogLines |
              Select-String -Pattern '^##\s+' |
              Where-Object { $_.LineNumber -gt $sectionStart } |
              Select-Object -First 1
          if ($nextSection) {
              $changelogSection = $changelogLines[($sectionStart - 1)..($nextSection.LineNumber - 2)]
          }
          else {
              $changelogSection = $changelogLines[($sectionStart - 1)..($changelogLines.Count - 1)]
          }

          $notes = @($changelogSection) + @(
              "",
              "## Install",
              "",
              "1. Download ``HdrImageViewer-$version-win-x64-portable.zip``.",
              "2. Extract the zip to a normal folder, for example ``C:\Apps\HdrImageViewer``.",
              "3. Run ``HdrImageViewer.exe``.",
              "",
              "Requires the x64 .NET 10 Desktop Runtime and Windows App Runtime 2.5. No certificate installation is required for the portable zip. Windows may show a SmartScreen warning because this GitHub build is unsigned.",
              "",
              "## Recommended Install",
              "",
              "For most users, install the Microsoft Store version so Windows handles signing and updates."
          )
          if (-not [string]::IsNullOrWhiteSpace($env:STORE_URL)) {
              $notes += ""
              $notes += "Microsoft Store: $env:STORE_URL"
          }
          $notes += @(
              "",
              "## Bundled Format Tools",
              "",
              "The x64 portable build includes the pinned JPEG XL, AVIF, HEIC, OpenEXR and Ultra HDR codecs and command-line tools. No separate MSYS2 installation is required for these formats.",
              "",
              "JPEG Ultra HDR and HEIC / AVIF ISO Gain Map exports support monochrome and RGB gain maps. Codec versions and source checksums are recorded in ``eng/codecs.lock.json``."
          )
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $zip --clobber
              gh release edit $tag --title $tag --notes-file $notesPath
          }
          else {
              gh release create $tag $zip --title $tag --notes-file $notesPath
          }
