name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify compiled shaders
        shell: pwsh
        run: |
          .\eng\CompileShaders.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code Rendering/Shaders
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build pinned codecs and OpenEXR bridge (x64)
        uses: ./.github/actions/build-codecs

      - name: Build app and test projects (x64)
        shell: pwsh
        run: |
          @(
            '.\HdrImageViewer.csproj',
            '.\tests\HdrImageViewer.Tests\HdrImageViewer.Tests.csproj',
            '.\tests\HdrImageViewer.WindowsTests\HdrImageViewer.WindowsTests.csproj',
            '.\tests\HdrImageViewer.IntegrationTests\HdrImageViewer.IntegrationTests.csproj'
          ) | ForEach-Object {
            dotnet build $_ -p:Platform=x64 -c Release --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run unit tests
        run: dotnet test .\tests\HdrImageViewer.Tests\HdrImageViewer.Tests.csproj -p:Platform=x64 -c Release --no-build --nologo

      - name: Run Windows tests
        run: dotnet test .\tests\HdrImageViewer.WindowsTests\HdrImageViewer.WindowsTests.csproj -p:Platform=x64 -c Release --no-build --nologo

      - name: Run integration tests
        shell: pwsh
        env:
          HDRIV_SETTINGS_PATH: ${{ runner.temp }}\hdriv-ci-settings.json
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP 'hdriv-integration'
          if (Test-Path -LiteralPath $outDir) { Remove-Item -LiteralPath $outDir -Recurse -Force }
          dotnet run --project .\tests\HdrImageViewer.IntegrationTests\HdrImageViewer.IntegrationTests.csproj -p:Platform=x64 -c Release --no-build -- --all $outDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify formatting
        shell: pwsh
        run: |
          @(
            '.\HdrImageViewer.csproj',
            '.\tests\HdrImageViewer.Tests\HdrImageViewer.Tests.csproj',
            '.\tests\HdrImageViewer.WindowsTests\HdrImageViewer.WindowsTests.csproj',
            '.\tests\HdrImageViewer.IntegrationTests\HdrImageViewer.IntegrationTests.csproj'
          ) | ForEach-Object {
            dotnet format $_ --verify-no-changes --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish portable x64 smoke artifact
        shell: pwsh
        run: |
          dotnet publish .\HdrImageViewer.csproj -c Release -p:Platform=x64 -p:PortableBuild=true -p:PublishDir=artifacts\ci-portable\ --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            'HdrImageViewer.exe',
            'App.xbf',
            'MainWindow.xbf',
            'HdrImageViewer.pri',
            'Pages\HomePage.xbf',
            'Assets\AppIcon.ico'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts\ci-portable' $_))) {
              throw "Portable publish is missing required runtime file: $_"
            }
          }
